<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="twitter:title" content="amnesfubbia">
    <meta name="twitter:image" content="amnesfubbia.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
    <style>
        /* ===== THEME VARIABLES ===== */
        :root {
            --bg: #000; --bg2: #000000; --bg3: #111; --bg4: #1a1a1a;
            --border: #1c1c1c; --border2: #2a2a2a;
            --text: #fff; --text2: #efefef; --text3: #8e8e8e; --text4: #555;
            --card: #111; --card2: #1a1a1a;
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            transition: background-color 0.3s, color 0.3s; 
            -webkit-tap-highlight-color: transparent;
        }

        :root { --status-bar-height: 28px; }
        /* Fix Horizontal Scroll & Safari Smoothness */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -webkit-overflow-scrolling: touch; }
        
        /* LOGO & SPLASH */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .splash-content { display: flex; flex-direction: column; align-items: center; animation: splashScale 0.8s ease-out; }
        .splash-logo { width: 80px; height: 80px; margin-bottom: 2px; }
        .splash-name { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; opacity: 0; animation: fadeIn 0.5s ease forwards; animation-delay: 0.4s; }
        .splash-footer { position: absolute; bottom: 40px; text-align: center; opacity: 0; animation: fadeIn 0.5s ease forwards; animation-delay: 0.8s; }
        .from-text { font-size: 12px; color: #8e8e8e; letter-spacing: 1px; margin-bottom: 5px; }
        .brand-text { 
            font-size: 14px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes splashScale { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* PWA Status Bar Fix */
        body.pwa-mode { padding-top: var(--status-bar-height); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px 14px 0; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; position: relative; cursor: pointer; }
        .ig-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -1px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 28px; margin-bottom: 15px; padding: 0 14px; }
        .profile-pic-container { position: relative; width: 78px; height: 78px; }
        .profile-pic-logo { width: 74px; height: 74px; border-radius: 50%; border: 1px solid #262626; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .add-story-btn { position: absolute; bottom: 2px; right: 2px; width: 22px; height: 22px; background: #0095f6; border: 2.5px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .stats { display: flex; flex-grow: 1; justify-content: space-between; text-align: center; padding-right: 20px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #8e8e8e; }
        .stat-val { font-weight: 700; font-size: 16px; color: #fff; line-height: 1; margin-bottom: 2px; }
        .stat-label { font-size: 13px; font-weight: 400; line-height: 1; }
        .stat-item.active-stat { color: #fff; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; margin-top: -8px; padding: 0 14px; }
        .bio-name-wrapper { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
        .bio-name { font-weight: 700; font-size: 13px; display: inline-block; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 15px; padding: 0 14px; }
        .btn-ig { flex: 1; background: #262626; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; transition: background 0.2s; border: none; }
        .btn-ig.active { background: #363636; border: 1px solid #555; }
        .btn-icon-sq { width: 34px; background: #262626; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }

        #filterBar { display: none; margin-bottom: 15px; padding: 0 14px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active-pill { border: 1px solid #fff; background: rgba(255,255,255,0.05); }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 9500; max-height: 60vh; overflow-y: auto; border-top: 1px solid #1c1c1c; animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sticky-reset { position: sticky; top: 0; background: #1c1c1c; z-index: 10; font-weight: 800 !important; color: #fff !important; border-bottom: 2px solid #333; padding: 12px; }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9400; }
        .filter-item { padding: 16px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #eee; cursor: pointer; }

        .highlights-wrapper { padding: 0 14px 15px 14px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 62px; height: 62px; border-radius: 50%; border: 0.5px solid #333; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        .highlight-item:active .highlight-circle { transform: scale(0.9); }
        .highlight-item.active-hl .highlight-circle { border: 2px solid #fff; }
        .highlight-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .logo-small img { width: 75%; height: 75%; object-fit: contain; }
        
        .highlight-text { font-size: 11px; color: #fff; font-weight: 400; white-space: nowrap; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; border: none; background: none; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #000000; overflow: hidden; cursor: pointer; border-radius: 10px; }
        .card-title-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px 7px 7px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); z-index: 3; }
        .card-title-text { font-size: 10px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .card-star { font-size: 9px; color: #f5c518; font-weight: 700; }
        .card-type-label { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .card-year { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 500; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; border: 0.5px solid #555; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid #555; }

        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; z-index: 100; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; border: none; }
        .search-input-box input { background: transparent !important; border: none; outline: none; color: #fff !important; font-size: 14px; width: 100%; margin-left: 8px; }
        /* Search type tabs */
        .search-tab {
            flex: 1; text-align: center; padding: 10px 0;
            font-size: 12px; font-weight: 700; color: #555;
            cursor: pointer; border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            background: none; border: none;
        }
        .search-tab.active { color: #fff; border-bottom-color: #fff; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; align-items: center; padding: 8px 0 16px; z-index: 1000; }
        .bottom-nav i { color: #a8a8a8; transition: color 0.3s; font-size: 20px; cursor: pointer; }
        .bottom-nav i.active-nav { color: #fff; }

        /* ===== SAFE AREA INSET FIX (Android status bar) ===== */
        .modal-player, #actorModal, #tvModal, #notifModal, #sideMenu, #searchOverlay,
        #reelsModal, #reelDetailSheet, #soundtrackModal, #actorPhotosModal {
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* LOADING SPINNER FOR IFRAME */
        .iframe-loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 5; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal Player */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 8000; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden; }
        .carousel-slide iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* About Page */
        #sideMenu {
            position: fixed; inset: 0; z-index: 9500; display: none;
            background: #000; overflow-y: auto; overflow-x: hidden;
            animation: aboutSlideIn 0.32s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes aboutSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .about-topbar {
            position: sticky; top: 0; z-index: 100;
            background: #000;
            border-bottom: 1px solid #1c1c1c;
            display: flex; align-items: center; padding: 0 16px; height: 54px;
        }
        .about-topbar-title {
            flex: 1; text-align: center;
            font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.3px;
        }
        .about-close-btn {
            font-size: 20px; color: #fff; cursor: pointer; padding: 6px; background: none; border: none;
            -webkit-tap-highlight-color: transparent;
        }

        .about-hero {
            display: flex; flex-direction: column; align-items: center;
            padding: 28px 20px 22px;
            border-bottom: 1px solid #1c1c1c;
            background: #000;
        }
        .about-app-name {
            font-size: 20px; font-weight: 900; color: #fff;
            letter-spacing: -0.5px; margin-bottom: 6px;
        }

        .about-credits {
            padding: 32px 20px 50px;
            text-align: center;
        }
        .about-credits-logo {
            width: 44px; height: 44px; border-radius: 12px;
            background: #111; border: 1px solid #1c1c1c;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin: 0 auto 12px;
        }
        .about-credits-logo img { width: 100%; height: 100%; object-fit: contain; }
        .about-credits-by {
            font-size: 15px; font-weight: 900; color: #fff;
            letter-spacing: -0.3px; margin-bottom: 4px;
        }

        /* Landscape Mode */
        .landscape-overlay { 
            display: none; position: fixed; inset: 0; z-index: 9900; background: #000;
        }

        .landscape-active #movieModal { overflow: hidden !important; }
        .landscape-active #modalScrollTop { height: 100vh; max-width: 100%; padding: 0; }
        .landscape-active .carousel-slide { height: 100vh; }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">
                <img src="amnesfubbia.png" alt="Logo" style="width:100%; height:100%;"/>
            </div>
            <div class="splash-name">amnesfubbia</div>
        </div>
        <div class="splash-footer">
            <div class="from-text">FROM</div>
            <div class="brand-text">amnesfubbia</div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="mainContainer" style="display: none;">
        <!-- Top Navigation -->
        <div class="top-bar">
            <div class="ig-logo-wrapper">
                <span class="ig-logo">amnesfubbia</span>
            </div>
        </div>

        <!-- Profile Section -->
        <div class="profile-info">
            <div class="profile-pic-container">
                <div class="profile-pic-logo">
                    <img src="amnesfubbia.png" alt="Profile" />
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">0</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>
        </div>

        <!-- Bio Section -->
        <div class="bio">
            <div class="bio-name-wrapper">
                <span class="bio-name">amnesfubbia</span>
            </div>
            <p style="margin: 0; font-size: 13px; color: #8e8e8e;">Music & Film Streaming Platform</p>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn-ig">Follow</button>
            <button class="btn-ig">Message</button>
            <button class="btn-icon-sq">
                <i class="fas fa-ellipsis-v"></i>
            </button>
        </div>

        <!-- Highlights -->
        <div class="highlights-wrapper">
            <div class="highlights-container no-scrollbar">
                <div class="highlight-item">
                    <div class="highlight-circle" style="background: #1a1a1a;">
                        <i class="fas fa-plus" style="font-size: 24px; color: #666;"></i>
                    </div>
                    <div class="highlight-text">New</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tab-nav">
            <button class="tab-item active" data-tab="posts">
                <i class="fas fa-th"></i>
            </button>
            <button class="tab-item" data-tab="reels">
                <i class="fas fa-play-circle"></i>
            </button>
        </div>

        <!-- Movie Grid -->
        <div class="movie-grid" id="movieGrid">
            <!-- Movies will be loaded here -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <i class="fas fa-home active-nav"></i>
        <i class="fas fa-search"></i>
        <i class="fas fa-plus-circle"></i>
        <i class="fas fa-heart"></i>
        <i class="fas fa-user"></i>
    </div>

    <!-- Side Menu (About) -->
    <div id="sideMenu">
        <div class="about-topbar">
            <button class="about-close-btn">
                <i class="fas fa-times"></i>
            </button>
            <div class="about-topbar-title">About</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="about-hero">
            <div class="about-app-name">amnesfubbia</div>
            <p style="color: #8e8e8e; margin: 0; font-size: 13px;">Music & Film Streaming</p>
        </div>
        <div class="about-credits">
            <div class="about-credits-logo">
                <img src="amnesfubbia.png" alt="App Logo" />
            </div>
            <div class="about-credits-by">amnesfubbia</div>
            <p style="color: #666; font-size: 12px; margin: 0;">© 2026 All Rights Reserved</p>
        </div>
    </div>

    <!-- Search Overlay -->
    <div id="searchOverlay">
        <div class="search-header">
            <button style="background: none; border: none; color: #fff; cursor: pointer; font-size: 20px;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="search-input-box">
                <i class="fas fa-search" style="color: #8e8e8e;"></i>
                <input type="text" placeholder="Search..." />
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            // Hide splash screen after 1.5 seconds
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                const main = document.getElementById('mainContainer');
                if (splash && main) {
                    splash.style.display = 'none';
                    main.style.display = 'block';
                }
            }, 1500);

            // Bottom nav interactions
            const navItems = document.querySelectorAll('.bottom-nav i');
            navItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    navItems.forEach(el => el.classList.remove('active-nav'));
                    this.classList.add('active-nav');
                    
                    if (index === 1) { // Search
                        document.getElementById('searchOverlay').style.display = 'block';
                    } else {
                        document.getElementById('searchOverlay').style.display = 'none';
                    }
                    
                    if (index === 4) { // Profile menu
                        document.getElementById('sideMenu').style.display = 'block';
                    } else {
                        document.getElementById('sideMenu').style.display = 'none';
                    }
                });
            });

            // Close menu button
            const closeBtn = document.querySelector('.about-close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    document.getElementById('sideMenu').style.display = 'none';
                });
            }

            // Tab switching
            const tabItems = document.querySelectorAll('.tab-item');
            tabItems.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabItems.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            console.log('✅ amnesfubbia app initialized successfully!');
        });

        // PWA detection
        if (window.navigator.standalone === true) {
            document.body.classList.add('pwa-mode');
        }
    </script>
</body>
</html>
