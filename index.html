<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Silmikaffah — Islam Secara Menyeluruh</title>
<style>
:root{
  --bg:#000;
  --card:#07100e;
  --card2:#0b1513;
  --line:#17312b;
  --text:#f4f7f6;
  --muted:#9aa9a5;
  --green:#16d0ad;
  --green2:#0fb795;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{color:inherit}
#splash{
  position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;
  z-index:9999;transition:.35s
}
.splash-inner{text-align:center}
.splash-logo{width:105px;height:105px;object-fit:contain;margin:auto;display:block}
.splash-title{font-size:25px;font-weight:800;margin-top:14px}
.splash-sub{color:var(--muted);margin-top:5px}
.app{max-width:900px;margin:auto;padding:26px 18px 100px}
header{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.header-logo{width:70px;height:70px;object-fit:contain}
.brand h1{font-size:30px;margin:0;font-weight:800}
.brand p{margin:4px 0 0;color:var(--muted);font-size:17px}
.search{width:100%;background:#07100e;border:1px solid var(--line);border-radius:24px;padding:17px 20px;color:var(--text);outline:none}
.search::placeholder{color:#77817f}
.search-wrap{position:relative;margin-bottom:24px}
.search-icon{position:absolute;left:20px;top:17px;color:var(--muted)}
.search{padding-left:53px}
.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#071712,#06100e);border:1px solid var(--line);border-radius:28px;padding:25px;margin:18px 0}
.hero-label{color:var(--green);font-weight:800;letter-spacing:1px;font-size:14px}
.hero-date{font-size:30px;font-weight:800;margin:8px 0 4px}
.hero-greg{color:var(--muted)}
.quote{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.quote-label{color:var(--green);font-weight:800}
.quote p{font-size:19px;line-height:1.55;margin:8px 0}
.quote small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.section-title h2{margin:0;font-size:25px}.section-title span{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;min-height:175px;cursor:pointer;transition:.18s}
.card:hover{border-color:var(--green2);transform:translateY(-1px)}
.icon{width:40px;height:40px;color:var(--green);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:0;color:var(--muted);line-height:1.45}
.quick{margin-top:22px}.quick .card{min-height:auto;text-align:center;padding:16px}
.quick .icon{margin:0 auto 7px}
.quick h3{font-size:16px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:800;font-size:19px;border:0;background:none;padding:5px 0;cursor:pointer;margin:4px 0 20px}
.detail-head,.content{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:25px;margin-bottom:16px}
.detail-head{display:flex;align-items:center;gap:18px}
.detail-head .icon{margin:0}
.detail-head h2{margin:0;font-size:30px}.detail-head p{margin:5px 0 0;color:var(--muted)}
.content h2{font-size:27px;margin-top:0}
.content h3{color:var(--green);font-size:21px;margin-top:25px}
.content p,.content li{font-size:17px;line-height:1.72}
.content ul{padding-left:23px}
.arabic{font-family:"Times New Roman",serif;direction:rtl;text-align:right;font-size:28px;line-height:1.9;margin:18px 0}
.source{border-top:1px solid var(--line);margin-top:24px;padding-top:15px;color:var(--muted);font-size:14px}
.subgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.subitem{background:var(--card2);border:1px solid var(--line);border-radius:17px;padding:16px;cursor:pointer}
.subitem b{font-size:16px}.subitem span{display:block;color:var(--muted);margin-top:5px;font-size:14px}
.bottom{
 position:fixed;left:0;right:0;bottom:0;height:72px;background:#030807;border-top:1px solid var(--line);
 display:grid;grid-template-columns:repeat(5,1fr);z-index:50
}
.navbtn{background:none;border:0;display:flex;align-items:center;justify-content:center;color:#8d9b98;cursor:pointer}
.navbtn.active{color:var(--green)}
.navbtn svg{width:27px;height:27px}
.no-results{padding:30px;color:var(--muted);text-align:center}
.light{--bg:#fff;--card:#fff;--card2:#f6f8f7;--line:#d8e3df;--text:#15201d;--muted:#687572}
.light .search,.light .bottom{background:#fff}
@media(max-width:650px){
 .app{padding:22px 14px 92px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .card{padding:14px;min-height:155px;border-radius:18px}
 .card h3{font-size:16px}.card p{font-size:13px}
 .icon{width:32px;height:32px}
 .brand h1{font-size:25px}.brand p{font-size:14px}.header-logo{width:62px;height:62px}
 .hero{padding:20px;border-radius:22px}.hero-date{font-size:25px}
 .content{padding:20px}.content p,.content li{font-size:16px}
 .detail-head{padding:20px}.detail-head h2{font-size:25px}
 .subgrid{grid-template-columns:1fr}
}
</style>
</head>

kamus:["Kamus Bahasa Arab","Kamus untuk mencari arti kosakata Arab dan padanannya dalam bahasa Indonesia.","Data kamus dapat disimpan lokal atau dihubungkan ke sumber data kamus.","Fitur","Pencarian kata • Arab ke Indonesia • Indonesia ke Arab • Riwayat pencarian"],
ushul:["Usul Fikih","Usul fikih membahas kaidah dan metode yang digunakan untuk memahami dan menetapkan hukum syariat.","Materi dasar meliputi Al-Qur'an, Sunnah, ijma, qiyas, dalil dan kaidah pengambilan hukum.","Catatan","Pembahasan lanjutan dapat mengikuti kitab usul fikih yang dipilih."],
qawaid:["Qawaid Fiqhiyyah","Qawaid fiqhiyyah adalah kaidah umum yang membantu memahami banyak persoalan fikih.","Contoh kaidah besar meliputi perkara bergantung pada tujuan, keyakinan tidak hilang karena keraguan, kesulitan mendatangkan kemudahan, kemudaratan harus dihilangkan dan adat dapat menjadi pertimbangan.","Fungsi","Membantu mengelompokkan dan memahami masalah fikih secara sistematis."],
faraid:["Faraid / Waris","Faraid adalah ilmu yang membahas pembagian harta warisan sesuai ketentuan syariat.","Materi meliputi sebab mewarisi, penghalang waris, ahli waris, bagian fardhu dan pengantar perhitungan.","Materi","Ahli waris • Ashabul furudh • Ashabah • Hijab • Pembagian waris"],
akhlak:["Akhlak & Adab","Akhlak membentuk perilaku seorang Muslim agar baik dalam hubungan dengan Allah dan sesama manusia.","Materi mencakup jujur, amanah, sabar, syukur, tawadhu, birrul walidain, adab bertetangga dan adab mencari ilmu.","Catatan","Materi diarahkan pada pembentukan karakter dan praktik sehari-hari."],
sirah:["Sirah Nabi","Sirah membahas perjalanan hidup Nabi Muhammad ﷺ, dakwah, keluarga, masyarakat dan peristiwa penting pada masa beliau.","Materi dapat disusun secara kronologis dari kelahiran, masa kenabian, hijrah, periode Madinah hingga wafat.","Materi","Makkah • Wahyu pertama • Dakwah • Hijrah • Madinah • Perjanjian • Fathu Makkah • Haji Wada"],
nikah:["Pernikahan","Pernikahan dalam Islam memiliki ketentuan, hak dan kewajiban yang perlu dipahami sebelum dan setelah akad.","Materi mencakup khitbah, wali, saksi, mahar, akad, nafkah dan tanggung jawab pasangan.","Catatan","Untuk persoalan hukum khusus, pengguna perlu merujuk kepada ulama atau lembaga yang kompeten."],
keluarga:["Keluarga","Keluarga dalam Islam dibangun dengan tanggung jawab, kasih sayang dan pemenuhan hak setiap anggota.","Materi mencakup hak suami-istri, pendidikan anak, birrul walidain dan komunikasi keluarga.","Praktik","Membangun keluarga dengan amanah, musyawarah dan adab yang baik."],
talak:["Talak & Rujuk","Talak dan rujuk memiliki ketentuan fikih yang rinci.","Materi pengantar membahas pengertian talak, jenis, masa iddah dan rujuk.","Penting","Kasus nyata harus dikonsultasikan kepada ahli fikih atau lembaga resmi karena detail hukumnya dapat berbeda menurut keadaan."],
muamalah:["Muamalah","Muamalah membahas hubungan dan transaksi antarmanusia.","Materi meliputi jual beli, sewa, utang piutang, akad, amanah dan larangan transaksi yang mengandung riba, gharar atau unsur terlarang.","Prinsip","Kerelaan, kejelasan akad, kejujuran dan tidak merugikan pihak lain."],
ekonomi:["Ekonomi Syariah","Ekonomi syariah membahas aktivitas ekonomi dengan memperhatikan prinsip-prinsip syariat.","Materi meliputi riba, jual beli, akad, investasi, zakat dan pengelolaan harta.","Catatan","Produk keuangan tertentu perlu diperiksa akad dan ketentuan hukumnya secara spesifik."],
wakaf:["Wakaf","Wakaf adalah menahan harta yang manfaatnya digunakan untuk tujuan yang dibenarkan syariat.","Materi meliputi pengertian, rukun, jenis, wakif, nazhir dan pemanfaatan wakaf.","Manfaat","Wakaf dapat menjadi sarana ibadah dan kemaslahatan masyarakat."],
wasiat:["Wasiat","Wasiat adalah pesan atau pemberian yang berlaku setelah seseorang meninggal sesuai ketentuan yang berlaku.","Materi meliputi pengertian, ketentuan, batasan dan hubungan wasiat dengan warisan.","Catatan","Wasiat perlu dipahami bersama aturan faraid agar tidak menimbulkan sengketa."],
takziah:["Takziah & Jenazah","Takziah adalah menghibur dan mendoakan keluarga yang sedang berduka.","Materi mencakup adab takziah, memandikan, mengkafani, menshalatkan dan memakamkan jenazah.","Adab","Menjaga ucapan, membantu keluarga, mendoakan dan menghindari hal yang memberatkan keluarga yang berduka."],
tetangga:["Adab Bertetangga","Islam mengajarkan berbuat baik kepada tetangga dan menjaga hak mereka.","Materi mencakup salam, membantu, menjaga privasi, tidak mengganggu dan menghormati perbedaan.","Praktik","Kebaikan kepada tetangga merupakan bagian dari akhlak sosial."],
perang:["Peristiwa & Peperangan","Sejarah Islam memiliki sejumlah peristiwa dan peperangan yang perlu dipelajari dalam konteks sejarahnya.","Materi dapat mencakup Badar, Uhud, Khandaq, Hudaibiyah, Fathu Makkah dan peristiwa penting lainnya.","Pendekatan","Pembahasan diarahkan pada kronologi, sebab, dampak dan pelajaran sejarah, bukan glorifikasi kekerasan."],
khulafa:["Khulafaur Rasyidin","Empat khalifah pertama setelah wafatnya Nabi Muhammad ﷺ adalah Abu Bakar, Umar, Utsman dan Ali رضي الله عنهم.","Materi mencakup masa kepemimpinan, kebijakan, kontribusi dan keteladanan.","Catatan","Pembahasan sejarah harus membedakan riwayat yang kuat dari riwayat yang diperselisihkan."],
sahabat:["Sahabat Nabi","Sahabat adalah generasi yang bertemu Nabi Muhammad ﷺ dalam keadaan beriman dan wafat dalam Islam.","Materi mencakup tokoh-tokoh sahabat, kontribusi dan keteladanan mereka.","Tokoh","Abu Bakar, Umar, Utsman, Ali, Bilal, Salman, Abu Hurairah dan banyak lainnya."],
ahlulbait:["Ahlul Bait","Ahlul Bait merujuk kepada keluarga Nabi Muhammad ﷺ dengan pembahasan sesuai sumber dan konteks yang digunakan.","Materi mencakup pengenalan keluarga Nabi dan keteladanan mereka.","Catatan","Pembahasan dilakukan dengan menghormati perbedaan tradisi keilmuan dan sumber sejarah."],
walisongo:["Wali Songo","Wali Songo dikenal dalam sejarah dakwah Islam di Nusantara.","Materi mencakup tokoh, wilayah dakwah, metode dakwah dan perkembangan masyarakat Muslim di Jawa.","Catatan","Sebagian detail sejarah memiliki variasi sumber sehingga rujukan perlu dicantumkan."],
dinasti:["Dinasti Islam","Sejarah pemerintahan Islam berkembang melalui berbagai dinasti dan wilayah.","Materi dapat mencakup Umayyah, Abbasiyah, Andalusia, Utsmani dan perkembangan dunia Islam lainnya.","Pembelajaran","Fokus pada sejarah, ilmu pengetahuan, pemerintahan, budaya dan kontribusi peradaban."],
ulama:["Tokoh Ulama","Ulama berperan dalam pengembangan ilmu agama dan pendidikan masyarakat.","Materi dapat berisi biografi, karya, guru-murid dan kontribusi keilmuan.","Catatan","Setiap biografi perlu disertai sumber yang dapat diverifikasi."],

"dzikir-pagi":["Dzikir Pagi & Petang","Dzikir pagi dan petang berisi bacaan yang dianjurkan untuk mengingat dan memohon perlindungan kepada Allah.","Materi ditampilkan dalam urutan yang mudah dibaca.","Format","Arab • Transliterasi • Arti • Sumber"],

orangtua:["Doa untuk Orang Tua","Islam menganjurkan berbakti dan mendoakan kedua orang tua.","Doa dapat disertai penjelasan tentang birrul walidain.","Doa","رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا"],

"jenazah-doa":["Doa Jenazah","Kumpulan doa untuk jenazah dan keluarga yang ditinggalkan.","Materi dapat dikelompokkan untuk sholat jenazah, setelah pemakaman dan takziah.","Catatan","Sertakan sumber setiap bacaan."],

function iconSvg(symbol){
 return `<div class="icon" aria-hidden="true">${symbol}</div>`;
}
function renderHome(){
 let h=`<section class="hero">
 <div class="hero-label">HARI INI • KALENDER HIJRIAH</div>
 <div class="hero-date" id="hijri">Memuat tanggal Hijriah...</div>
 <div class="hero-greg" id="greg"></div>
 <div class="quote"><div class="quote-label">✦ KUTIPAN HARI INI</div><p id="quoteText"></p><small id="quoteSource"></small></div>
 </section>
 <div class="section-title"><h2>Menu Utama</h2><span>10 kategori</span></div>
 <div class="grid">`;
 menus.filter(x=>x.id!=="koleksi"&&x.id!=="alat").forEach(m=>{
   h+=`<article class="card" onclick="openCategory('${m.id}')">${iconSvg(m.icon)}<h3>${m.title}</h3><p>${m.desc}</p></article>`;
 });
 h+=`<article class="card" onclick="openCategory('kitab')">${iconSvg("▢")}<h3>Kitab</h3><p>${menus.find(x=>x.id==="kitab").desc}</p></article>
 <article class="card" onclick="openCategory('doa')">${iconSvg("✋")}<h3>Doa & Dzikir</h3><p>${menus.find(x=>x.id==="doa").desc}</p></article>
 <article class="card" onclick="openCategory('alat')">${iconSvg("◈")}<h3>Alat Muslim</h3><p>${menus.find(x=>x.id==="alat").desc}</p></article>
 <article class="card" onclick="openCategory('koleksi')">${iconSvg("♧")}<h3>Referensi & Koleksi</h3><p>${menus.find(x=>x.id==="koleksi").desc}</p></article>
 </div>`;
 document.getElementById("home").innerHTML=h;
 setDate();
}
function renderCategory(m){
 const v=document.getElementById(m.id);
 v.innerHTML=`<button class="back" onclick="goBack()">← Kembali</button>
 <div class="detail-head">${iconSvg(m.icon)}<div><h2>${m.title}</h2><p>Silmikaffah • Islam Secara Menyeluruh</p></div></div>
 <div class="content"><h2>${m.title}</h2><p>${m.desc}</p><h3>Submenu</h3><div class="subgrid">${
 m.items.map(i=>`<div class="subitem" onclick="openMaterial('${i[0]}','${m.title}')"><b>${i[1]}</b><span>${i[2]}</span></div>`).join("")
 }</div></div>`;
}
function openCategory(id){
 const m=menus.find(x=>x.id===id); if(!m)return;
 history.pushState({view:m.id},"","#"+m.id);
 show(m.id);
}
function openMaterial(id,parent){
 const d=content[id];
 if(!d){openMaterialFallback(id,parent);return}
 history.pushState({view:"detail",id,parent},"","#materi-"+id);
 document.getElementById("detail").innerHTML=`<button class="back" onclick="goBack()">← Kembali</button>
 <div class="detail-head">${iconSvg("▤")}<div><h2>${d[0]}</h2><p>${parent} • Silmikaffah</p></div></div>
 <article class="content"><h2>${d[0]}</h2><p>${d[1]}</p><h3>${d[3]}</h3><p>${d[2]}</p><div class="arabic">${d[4]||""}</div>
 <div class="source"><b>Dali​l / Referensi</b><br>Konten perlu mencantumkan sumber primer atau referensi kitab/API yang digunakan pada saat finalisasi database.</div></article>`;
 show("detail");
}
function openMaterialFallback(id,parent){
 const m=menus.flatMap(x=>x.items).find(i=>i[0]===id);
 if(!m)return;
 history.pushState({view:"detail",id,parent},"","#materi-"+id);
 document.getElementById("detail").innerHTML=`<button class="back" onclick="goBack()">← Kembali</button>
 <div class="detail-head">${iconSvg("▤")}<div><h2>${m[1]}</h2><p>${parent} • Silmikaffah</p></div></div>
 <article class="content"><h2>${m[1]}</h2><p>${m[2]}</p><h3>Materi</h3><p>Materi ini disusun sebagai bagian dari ${parent}. Struktur pembahasan siap dikembangkan dengan dalil, Arab, terjemahan dan referensi terverifikasi.</p></article>`;
 show("detail");
}
function renderSpecial(){
 const ri=menus.find(x=>x.id==="rukun-iman"), rs=menus.find(x=>x.id==="rukun-islam");
 document.getElementById("rukun-iman").innerHTML=categoryPage(ri);
 document.getElementById("rukun-islam").innerHTML=categoryPage(rs);
 document.getElementById("koleksi").innerHTML=categoryPage(menus.find(x=>x.id==="koleksi"));
 document.getElementById("pengaturan").innerHTML=`<div class="section-title"><h2>Pengaturan</h2></div>
 <div class="content"><h2>Tampilan</h2><p>Tema default Silmikaffah adalah Gelap AMOLED.</p>
 <div class="subgrid"><div class="subitem" onclick="setTheme('dark')"><b>Gelap AMOLED</b><span>Hitam pekat dengan aksen hijau teal.</span></div>
 <div class="subitem" onclick="setTheme('light')"><b>Terang Putih</b><span>Latar putih dengan teks gelap.</span></div></div>
 <h3>Pengaturan lainnya</h3><ul><li>Ukuran font</li><li>Teks Arab</li><li>Notifikasi</li><li>Lokasi</li><li>Metode jadwal sholat</li></ul></div>`;
}
function categoryPage(m){
 return `<button class="back" onclick="show('home')">← Kembali</button><div class="detail-head">${iconSvg(m.icon)}<div><h2>${m.title}</h2><p>${m.desc}</p></div></div>
 <div class="content"><h2>Daftar Materi</h2><div class="subgrid">${m.items.map(i=>`<div class="subitem" onclick="openMaterial('${i[0]}','${m.title}')"><b>${i[1]}</b><span>${i[2]}</span></div>`).join("")}</div></div>`;
}
function show(id){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
 const el=document.getElementById(id); if(el)el.classList.add("active");
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
 window.scrollTo({top:0,behavior:"smooth"});
}
function goBack(){
 if(history.length>1) history.back(); else show("home");
}
window.addEventListener("popstate",()=>{
 const hash=location.hash.replace("#","");
 if(hash.startsWith("materi-")) show("detail");
 else if(["home","rukun-iman","rukun-islam","koleksi","pengaturan"].includes(hash)) show(hash);
 else if(hash && document.getElementById(hash)) show(hash);
 else show("home");
});
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{
 const id=b.dataset.view; history.pushState({view:id},"","#"+id); show(id);
});
function setTheme(t){
 document.body.classList.toggle("light",t==="light");
 localStorage.setItem("theme",t);
}
function setDate(){
 const now=new Date();
 document.getElementById("greg").textContent=now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 // Approximate display is intentionally labeled; production should use a verified Hijri API/calculation.
 const quotes=[
  ["Sesungguhnya amal itu tergantung pada niatnya.","HR. Bukhari dan Muslim"],
  ["Sebaik-baik kalian adalah yang belajar Al-Qur'an dan mengajarkannya.","HR. Bukhari"],
  ["Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya.","QS. Al-Baqarah: 286"],
  ["Dan barang siapa bertawakal kepada Allah, niscaya Allah akan mencukupkan keperluannya.","QS. At-Talaq: 3"]
 ];
 const q=quotes[now.getDate()%quotes.length];
 document.getElementById("quoteText").textContent="“"+q[0]+"”";
 document.getElementById("quoteSource").textContent=q[1];
 // Keep Hijri label separate from Gregorian. This uses Intl when supported.
 try{
   const f=new Intl.DateTimeFormat("id-ID-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"});
   document.getElementById("hijri").textContent=f.format(now).replace(" AH"," H");
 }catch(e){document.getElementById("hijri").textContent="Tanggal Hijriah";}
}
function search(q){
 q=q.toLowerCase().trim(); if(!q){show("home");return}
 const results=[];
 menus.forEach(m=>m.items.forEach(i=>{if((i[1]+" "+i[2]).toLowerCase().includes(q))results.push([i,m.title])}));
 document.getElementById("detail").innerHTML=`<button class="back" onclick="goBack()">← Kembali</button>
 <div class="content"><h2>Hasil Pencarian</h2>${results.length?results.map(r=>`<div class="subitem" style="margin:10px 0" onclick="openMaterial('${r[0][0]}','${r[1]}')"><b>${r[0][1]}</b><span>${r[1]} • ${r[0][2]}</span></div>`).join(""):`<div class="no-results">Tidak ada materi yang ditemukan.</div>`}</div>`;
 history.pushState({view:"detail"},"","#pencarian");show("detail");
}
document.getElementById("search").addEventListener("input",e=>search(e.target.value));
renderHome(); renderSpecial();
setTheme(localStorage.getItem("theme")||"dark");
setTimeout(()=>{document.getElementById("splash").style.opacity="0";setTimeout(()=>document.getElementById("splash").remove(),350)},900);
</script>
</body>
</html>
